<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ริลลดาพันธุ์ไม้ · แรงบันดาลใจสวนในฝันของคุณ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f4f8f0;
    --bg-2:#e9f1e2;
    --panel:#ffffff;
    --panel-2:#eef4e8;
    --ink:#26382a;
    --ink-soft:#5c6f5a;
    --moss:#6f9464;
    --moss-deep:#3f6b3f;
    --gold:#7a9b5e;
    --stamp:#2f5233;
    --line:rgba(63,107,63,0.16);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;margin:0;overscroll-behavior:none;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    overflow:hidden;
  }

  .deck{
    display:flex;
    height:100vh;
    height:100dvh;
    width:100vw;
    overflow-x:auto;
    overflow-y:hidden;
    scroll-snap-type:x mandatory;
    scroll-behavior:smooth;
  }
  .deck::-webkit-scrollbar{display:none;}
  .slide{
    flex:none;
    width:100vw;
    height:100vh;
    height:100dvh;
    scroll-snap-align:start;
    position:relative;
    display:flex;
    flex-direction:column;
  }

  /* ===== Cover slide ===== */
  .cover{
    align-items:center;justify-content:center;text-align:center;
    background:
      radial-gradient(circle at 20% 12%, rgba(111,148,100,0.20), transparent 46%),
      radial-gradient(circle at 85% 88%, rgba(63,107,63,0.12), transparent 42%),
      var(--bg);
    padding:0 28px;
  }
  .cover .leaf{width:56px;height:56px;margin-bottom:18px;opacity:0.95;}
  .cover h1{font-family:'Fraunces',serif;font-weight:700;font-size:38px;margin:0 0 10px;letter-spacing:0.2px;color:var(--moss-deep);}
  .cover p{font-family:'IBM Plex Mono',monospace;font-size:12.5px;letter-spacing:0.6px;color:var(--moss);margin:0 0 40px;}
  .swipe-hint{display:flex;align-items:center;gap:8px;color:var(--ink-soft);font-size:12.5px;
    animation:nudge 1.8s ease-in-out infinite;}
  @keyframes nudge{0%,100%{transform:translateX(0);}50%{transform:translateX(8px);}}

  /* ===== Portfolio slide ===== */
  .portfolio{background:var(--bg);}
  .portfolio .art{
    flex:0 0 56%;position:relative;display:flex;align-items:center;justify-content:center;
    overflow:hidden;background:linear-gradient(160deg,#e4efdd,#d3e6c9);
  }
  .portfolio .art svg{width:58%;max-width:220px;height:auto;position:relative;z-index:1;}
  .portfolio .art .photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;}
  .stamp{
    position:absolute;right:22px;bottom:-30px;z-index:2;
    width:104px;height:104px;border-radius:50%;
    border:2px solid var(--stamp);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    transform:rotate(-9deg);
    background:rgba(255,255,255,0.55);
    backdrop-filter:blur(2px);
  }
  .stamp::before{
    content:'';position:absolute;inset:6px;border:1px dashed var(--stamp);border-radius:50%;opacity:0.7;
  }
  .stamp .lbl{font-family:'IBM Plex Mono',monospace;font-size:8.5px;color:var(--stamp);letter-spacing:0.5px;}
  .stamp .amt{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--stamp);font-weight:600;text-align:center;line-height:1.25;padding:0 6px;}

  .portfolio .panel{
    flex:1;background:var(--panel);color:var(--ink);border-radius:26px 26px 0 0;
    padding:44px 26px 26px;position:relative;overflow-y:auto;
    box-shadow:0 -6px 24px rgba(63,107,63,0.10);
  }
  .portfolio .eyebrow{font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:0.5px;
    color:var(--moss-deep);margin-bottom:6px;}
  .portfolio h2{font-family:'Fraunces',serif;font-size:25px;font-weight:600;margin:0 0 10px;color:var(--ink);}
  .portfolio .desc{font-size:13.5px;line-height:1.6;color:var(--ink-soft);margin:0 0 18px;}
  .plant-list-lbl{font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:0.3px;
    color:var(--moss-deep);margin-bottom:8px;}
  .chips{display:flex;flex-wrap:wrap;gap:7px;}
  .chip{font-size:12px;background:rgba(63,107,63,0.10);color:var(--moss-deep);
    border:1px solid rgba(63,107,63,0.18);
    border-radius:20px;padding:5px 12px;font-family:'Inter',sans-serif;font-weight:500;}

  /* ===== Menu slide ===== */
  .menu-slide{background:var(--panel);color:var(--ink);overflow-y:auto;padding:56px 22px 40px;}
  .menu-slide .head{margin-bottom:20px;}
  .menu-slide .eyebrow{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--moss-deep);letter-spacing:0.5px;}
  .menu-slide h2{font-family:'Fraunces',serif;font-size:26px;font-weight:700;margin:6px 0 4px;}
  .menu-slide .sub{font-size:12.5px;color:var(--ink-soft);}
  .menu-group{margin-top:26px;}
  .menu-group h3{font-family:'IBM Plex Mono',monospace;font-size:11.5px;letter-spacing:0.4px;
    color:var(--moss-deep);text-transform:none;margin:0 0 10px;padding-bottom:8px;border-bottom:1px solid rgba(36,29,18,0.12);}
  .menu-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
  .menu-item{background:var(--panel-2);border:1px solid rgba(63,107,63,0.12);border-radius:12px;padding:12px 13px;}
  .menu-item .n{font-family:'Fraunces',serif;font-weight:600;font-size:14.5px;color:var(--ink);}
  .menu-item .m{font-size:10.5px;color:var(--moss-deep);margin-top:2px;}

  /* ===== Contact slide ===== */
  .contact{align-items:center;justify-content:center;text-align:center;
    background:
      radial-gradient(circle at 80% 15%, rgba(111,148,100,0.18), transparent 45%),
      var(--bg);
    padding:0 30px;}
  .contact .leaf{width:44px;height:44px;margin-bottom:16px;opacity:0.95;}
  .contact h2{font-family:'Fraunces',serif;font-size:26px;font-weight:700;margin:0 0 10px;color:var(--moss-deep);}
  .contact p{font-size:13.5px;color:var(--ink-soft);margin:0 0 26px;line-height:1.6;}
  .contact-card{background:var(--panel);border:1px solid var(--line);border-radius:16px;
    padding:20px 24px;font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--ink);line-height:2;
    box-shadow:0 6px 20px rgba(63,107,63,0.10);}

  /* ===== Dots ===== */
  .dots{position:fixed;bottom:16px;left:0;right:0;display:flex;justify-content:center;gap:7px;z-index:10;
    pointer-events:none;}
  .dot{width:6px;height:6px;border-radius:50%;background:rgba(63,107,63,0.28);transition:all .25s;}
  .dot.active{background:var(--gold);width:18px;border-radius:4px;}

  /* ===== Loading ===== */
  #loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    background:var(--bg);z-index:50;font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--moss);}

  @media(min-width:720px){
    .portfolio{flex-direction:row;}
    .portfolio .art{flex:0 0 46%;}
    .portfolio .panel{border-radius:26px 0 0 26px;display:flex;flex-direction:column;justify-content:center;}
    .menu-grid{grid-template-columns:repeat(4,1fr);}
  }
</style>
</head>

      {order:4,title:'สวนสไตล์ญี่ปุ่นเซน',desc:'ความสงบและสมดุลคือหัวใจ ใช้ไผ่ หิน และพื้นที่ว่างอย่างตั้งใจ เหมาะกับมุมพักผ่อนหรือลานทำสมาธิในบ้าน',budget:'30,000–100,000฿',plants:['ไผ่มงคล','จั๋ง','คล้า'],photo:''},

    ],
    plants:[

      {order:3,name:'เศรษฐีเรือนใน',cat:'ไม้ประดับ'},{order:4,name:'โกสน',cat:'ไม้ประดับ'},
      {order:5,name:'กุหลาบ',cat:'ไม้ดอก'},{order:6,name:'มะลิ',cat:'ไม้ดอก'},
      {order:7,name:'เฟื่องฟ้า',cat:'ไม้ดอก'},{order:8,name:'ดาวเรือง',cat:'ไม้ดอก'},

      {order:11,name:'ทองอุไร',cat:'ไม้มงคล'},{order:12,name:'กวักมรกต',cat:'ไม้มงคล'},
      {order:13,name:'กระบองเพชร',cat:'ไม้อวบน้ำ'},{order:14,name:'ว่านหางจระเข้',cat:'ไม้อวบน้ำ'},

      {order:17,name:'มะนาว',cat:'ไม้ผล'},{order:18,name:'มะกรูด',cat:'ไม้มงคล'},
      {order:19,name:'กะเพรา',cat:'สมุนไพร'},{order:20,name:'โหระพา',cat:'สมุนไพร'}
    ],
    contact:{ line:'@rinlada-plant', phone:'095-121-0221', facebook:'รินลดา พันธุ์ไม้',
      title:'สนใจจัดสวนสไตล์ไหน?', desc:'ทักหาเราได้เลย ทีมงานยินดีให้คำปรึกษาและประเมินงบประมาณเบื้องต้นฟรี' }
  };

  /* ---- SVG art fallback ตามลำดับสไตล์ (ใช้เมื่อไม่มีรูปจริง) ---- */
  const ART = [
    '<svg viewBox="0 0 100 100" fill="none"><path d="M50 90V45" stroke="#7fa06e" stroke-width="3" stroke-linecap="round"/><path d="M50 50C30 45 15 30 15 15C35 15 50 30 50 50Z" fill="#7fa06e"/><path d="M50 50C70 45 85 30 85 15C65 15 50 30 50 50Z" fill="#5f8552"/><path d="M50 60C33 58 20 46 18 32C36 34 50 44 50 60Z" fill="#4f6b45"/><path d="M50 60C67 58 80 46 82 32C64 34 50 44 50 60Z" fill="#3d5636"/></svg>',
    '<svg viewBox="0 0 100 100" fill="none"><rect x="30" y="55" width="40" height="30" rx="3" stroke="#7f9b6f" stroke-width="2.5"/><path d="M50 55V25" stroke="#7fa06e" stroke-width="3" stroke-linecap="round"/><path d="M50 30c-8 0-14 6-14 6s6 6 14 6 14-6 14-6-6-6-14-6Z" fill="#7fa06e"/><line x1="15" y1="90" x2="85" y2="90" stroke="#7f9b6f" stroke-width="1.5"/></svg>',
    '<svg viewBox="0 0 100 100" fill="none"><circle cx="50" cy="42" r="14" fill="#c98a9e"/><circle cx="50" cy="42" r="7" fill="#e0a8b8"/><path d="M50 56V85" stroke="#7fa06e" stroke-width="3" stroke-linecap="round"/><path d="M50 65c-8-2-12 4-12 4s6 5 12 3M50 70c8-2 12 4 12 4s-6 5-12 3" stroke="#7fa06e" stroke-width="2.5" fill="none" stroke-linecap="round"/></svg>',
    '<svg viewBox="0 0 100 100" fill="none"><circle cx="50" cy="55" r="28" stroke="#7f9b6f" stroke-width="1.2" opacity="0.6"/><circle cx="50" cy="55" r="20" stroke="#7f9b6f" stroke-width="1.2" opacity="0.6"/><circle cx="50" cy="55" r="12" stroke="#7f9b6f" stroke-width="1.2" opacity="0.6"/><rect x="46" y="15" width="4" height="35" rx="2" fill="#7fa06e"/><rect x="56" y="22" width="4" height="28" rx="2" fill="#5f8552"/><rect x="38" y="20" width="4" height="30" rx="2" fill="#5f8552"/></svg>',
    '<svg viewBox="0 0 100 100" fill="none"><path d="M50 20c-14 0-14 14 0 14s14-14 0-14ZM50 66c-14 0-14 14 0 14s14-14 0-14ZM26 44c0-14 14-14 14 0s-14 14-14 0ZM74 44c0-14-14-14-14 0s14 14 14 0Z" fill="#7a9b5e"/><circle cx="50" cy="44" r="7" fill="#2f5233"/></svg>',
    '<svg viewBox="0 0 100 100" fill="none"><path d="M30 80c0-25 8-45 20-55 12 10 20 30 20 55" stroke="#7fa06e" stroke-width="2.5" fill="none"/><path d="M50 25c-4 8-4 20 0 30M50 30c6 6 6 16 2 24M50 35c-6 4-8 14-4 22" stroke="#7fa06e" stroke-width="2" fill="none" stroke-linecap="round"/><rect x="24" y="80" width="52" height="10" rx="4" fill="#7a9b5e"/></svg>'
  ];
  const ART_BG = ['#e4efdd,#d3e6c9','#eaf0e6,#d8e4d0','#f2eee7,#e9ddd3','#e9efe6,#d6e2ce','#f3eddd,#e9dcc2','#edf1e0,#dde6c9'];

  /* ---- Firestore helpers ---- */
  function fromFs(f){
    if(!f) return null;
    if('stringValue' in f) return f.stringValue;
    if('integerValue' in f) return parseInt(f.integerValue,10);
    if('doubleValue' in f) return f.doubleValue;
    if('booleanValue' in f) return f.booleanValue;
    if('arrayValue' in f) return (f.arrayValue.values||[]).map(fromFs);
    if('mapValue' in f){ const o={}; const fl=f.mapValue.fields||{}; for(const k in fl) o[k]=fromFs(fl[k]); return o; }
    if('nullValue' in f) return null;
    return null;
  }
  function docToObj(doc){ const o=fromFs({mapValue:{fields:doc.fields||{}}}); o._id=doc.name.split('/').pop(); return o; }

  async function login(){
    const r=await fetch(`https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key=${API_KEY}`,{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({email:RO_EMAIL,password:RO_PASS,returnSecureToken:true})
    });
    const d=await r.json();
    if(d.error) throw new Error(d.error.message);
    idToken=d.idToken;
  }
  async function listDocs(col){
    let out=[],token='';
    do{
      const url=`${BASE}/${col}?pageSize=300`+(token?`&pageToken=${token}`:'');
      const d=await(await fetch(url,{headers:{'Authorization':'Bearer '+idToken}})).json();
      (d.documents||[]).forEach(doc=>out.push(docToObj(doc)));
      token=d.nextPageToken||'';
    }while(token);
    return out;
  }
  async function getDoc(path){
    const d=await(await fetch(`${BASE}/${path}`,{headers:{'Authorization':'Bearer '+idToken}})).json();
    if(d.error||!d.fields) return null;
    return docToObj(d);
  }

  /* ---- โหลดข้อมูล: Firebase ก่อน, ล้มเหลวใช้ DEFAULT ---- */
  async function loadData(){
    try{
      if(API_KEY.startsWith('ใส่')) throw new Error('ยังไม่ตั้งค่า');
      await login();
      const [gardens,plants,cover,contact]=await Promise.all([
        listDocs('gardens'), listDocs('plants'),
        getDoc('config/cover'), getDoc('config/contact')
      ]);
      return {
        cover: cover||DEFAULT.cover,
        contact: contact||DEFAULT.contact,
        gardens: (gardens.length?gardens:DEFAULT.gardens).slice().sort((a,b)=>(a.order||0)-(b.order||0)),
        plants: (plants.length?plants:DEFAULT.plants).slice().sort((a,b)=>(a.order||0)-(b.order||0))
      };
    }catch(e){
      return DEFAULT;
    }
  }

  /* ---- render ---- */
  const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

  function render(data){
    const deck=document.getElementById('deck');
    let html='';

    // cover
    html+=`<section class="slide cover">
      <svg class="leaf" viewBox="0 0 44 44" fill="none"><path d="M22 4C10 4 4 14 4 24c0 8 6 14 14 14 0 0 0-8 4-14 4-6 12-8 12-8S30 4 22 4Z" fill="#6f9464"/><path d="M8 40C8 26 22 22 22 22" stroke="#3f6b3f" stroke-width="2" stroke-linecap="round"/></svg>
      <h1>${esc(data.cover.title)}</h1>
      <p>${esc(data.cover.subtitle)}</p>
      <div class="swipe-hint">ปัดดูผลงานจัดสวน →</div>
    </section>`;

    // gardens
    data.gardens.forEach((g,i)=>{
      const artIdx=i%ART.length;
      const bg=ART_BG[artIdx];
      const artInner = g.photo
        ? `<img class="photo" src="${esc(g.photo)}" alt="${esc(g.title)}" onerror="this.style.display='none'">`
        : ART[artIdx];
      const chips=(g.plants||[]).map(p=>`<span class="chip">${esc(p)}</span>`).join('');
      html+=`<section class="slide portfolio">
        <div class="art" style="background:linear-gradient(160deg,${bg});">
          ${artInner}
          <div class="stamp"><div class="lbl">งบประมาณ</div><div class="amt">${esc(g.budget).replace('–','–<br>')}</div></div>
        </div>
        <div class="panel">
          <div class="eyebrow">GARDEN STYLE · ${String(i+1).padStart(2,'0')}</div>
          <h2>${esc(g.title)}</h2>
          <p class="desc">${esc(g.desc)}</p>
          <div class="plant-list-lbl">🌿 ต้นไม้ที่ใช้</div>
          <div class="chips">${chips}</div>
        </div>
      </section>`;
    });

    // plant menu (group by cat)
    const cats={};
    data.plants.forEach(p=>{ (cats[p.cat]=cats[p.cat]||[]).push(p); });
    let groups='';
    Object.keys(cats).forEach(cat=>{
      const items=cats[cat].map(p=>`<div class="menu-item"><div class="n">${esc(p.name)}</div><div class="m">${esc(p.cat)}</div></div>`).join('');
      groups+=`<div class="menu-group"><h3>${esc(cat)}</h3><div class="menu-grid">${items}</div></div>`;
    });
    html+=`<section class="slide menu-slide">
      <div class="head">
        <div class="eyebrow">🌿 PLANT MENU</div>
        <h2>เมนูต้นไม้ที่มี</h2>
        <p class="sub">ตัวอย่างพรรณไม้ยอดนิยม สอบถามรายการและราคาปัจจุบันเพิ่มเติมได้</p>
      </div>${groups}</section>`;

    // contact
    const c=data.contact;
    html+=`<section class="slide contact">
      <svg class="leaf" viewBox="0 0 44 44" fill="none"><path d="M22 4C10 4 4 14 4 24c0 8 6 14 14 14 0 0 0-8 4-14 4-6 12-8 12-8S30 4 22 4Z" fill="#6f9464"/></svg>
      <h2>${esc(c.title)}</h2>
      <p>${esc(c.desc)}</p>
      <div class="contact-card">
        LINE: ${esc(c.line)}<br>
        โทร: ${esc(c.phone)}<br>
        Facebook: ${esc(c.facebook)}
      </div>
    </section>`;

    deck.innerHTML=html;
    buildDots();
    document.getElementById('loading').style.display='none';
  }

  function buildDots(){
    const slides=document.querySelectorAll('.slide');
    const dotsWrap=document.getElementById('dots');
    dotsWrap.innerHTML='';
    slides.forEach((_,i)=>{
      const d=document.createElement('div');
      d.className='dot'+(i===0?' active':'');
      dotsWrap.appendChild(d);
    });
  }

  const deck=document.getElementById('deck');
  deck.addEventListener('scroll',()=>window.requestAnimationFrame(()=>{
    const idx=Math.round(deck.scrollLeft/window.innerWidth);
    document.querySelectorAll('.dot').forEach((d,i)=>d.classList.toggle('active',i===idx));
  }));
  document.addEventListener('keydown',e=>{
    if(e.key==='ArrowRight') deck.scrollBy({left:window.innerWidth,behavior:'smooth'});
    if(e.key==='ArrowLeft') deck.scrollBy({left:-window.innerWidth,behavior:'smooth'});
  });

  window.addEventListener('load',async()=>{ render(await loadData()); });
</script>
</body>
</html>
